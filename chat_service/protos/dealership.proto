syntax = "proto3";
package dealership.v1;

service ChatService {
  rpc GetSessionStatus (SessionRequest) returns (SessionStatusResponse);
  rpc SaveHumanMessage (MessageRequest) returns (MessageResponse);
  rpc UpdateSessionAgent (ClaimRequest) returns (ClaimResponse);

  rpc GetSessionsList (SessionListRequest) returns (SessionListResponse);
  rpc GetSessionMessages (SessionMessagesRequest) returns (SessionMessagesResponse);
}

message SessionRequest {
  string session_id = 1;
}

message SessionStatusResponse {
  enum Status {
    UNKNOWN = 0;
    BOT_ACTIVE = 1;
    HUMAN_REQUESTED = 2;
    HUMAN_ACTIVE = 3;
    RESOLVED = 4;
  }
  Status status = 1;
  string assigned_agent_id = 2;
}

message MessageRequest {
  string session_id = 1;
  string agent_id = 2;
  string message_text = 3;
}

message MessageResponse {
  string message_id = 1;
  bool success = 2;
  string timestamp = 3;
}

message ClaimRequest {
  string session_id = 1;
  string agent_id = 2;
}

message ClaimResponse {
  bool success = 1;
  string error_message = 2;
}

message SessionListRequest {
  string status = 1;
  string assigned_agent_id = 2;
}

message SessionListResponse {
  repeated ChatSession sessions = 1;
}

message ChatSession {
  string session_id = 1;
  string contact_id = 2;
  string status = 3;
  string assigned_agent_id = 4;
  string updated_at = 5;
}

message SessionMessagesRequest {
  string session_id = 1;
}

message SessionMessagesResponse {
  repeated ChatMessage messages = 1;
}

message ChatMessage {
  string message_id = 1;
  string sender_type = 2; 
  string sender_id = 3;
  string message_text = 4;
  string timestamp = 5;
}