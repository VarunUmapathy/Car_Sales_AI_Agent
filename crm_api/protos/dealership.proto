syntax = "proto3";
package dealership.v1;

service AuthService {
  rpc ValidateToken (TokenRequest) returns (UserProfile);
  rpc CheckAgentPermissions (PermissionRequest) returns (PermissionResponse);
  rpc GetAgentProfile (AgentRequest) returns (AgentProfile);
}

message TokenRequest {
  string token = 1;
}

message UserProfile {
  string agent_id = 1;
  string sso_user_id = 2;
  string email = 3;
  string name = 4;
  string role = 5;
  bool is_valid = 6;
  string error_message = 7; 
}

message PermissionRequest {
  string agent_id = 1;
  string required_role = 2;
}

message PermissionResponse {
  bool has_permission = 1;
}

message AgentRequest {
  string agent_id = 1;
}

message AgentProfile {
  string agent_id = 1;
  string name = 2;
  string email = 3;
  string role = 4;
  bool is_online = 5;
}

service ChatService {
  rpc GetSessionStatus (SessionRequest) returns (SessionStatusResponse);
  rpc SaveHumanMessage (MessageRequest) returns (MessageResponse);
  rpc UpdateSessionAgent (ClaimRequest) returns (ClaimResponse);
}

message SessionRequest {
  string session_id = 1;
}

message SessionStatusResponse {
  enum Status {
    UNKNOWN = 0;
    BOT_ACTIVE = 1;
    HUMAN_REQUESTED = 2;
    HUMAN_ACTIVE = 3;
    RESOLVED = 4;
  }
  Status status = 1;
  string assigned_agent_id = 2;
}

message MessageRequest {
  string session_id = 1;
  string agent_id = 2;
  string message_text = 3;
}

message MessageResponse {
  string message_id = 1;
  bool success = 2;
  string timestamp = 3;
}

message ClaimRequest {
  string session_id = 1;
  string agent_id = 2;
}

message ClaimResponse {
  bool success = 1;
  string error_message = 2; 
}

service InventoryService {
  rpc GetModelsList (ModelsListRequest) returns (ModelsListResponse);
  rpc CheckAvailability (AvailabilityRequest) returns (InventoryUnit);
  rpc UpdateUnitStatus (UpdateUnitRequest) returns (UpdateUnitResponse);
}

message ModelsListRequest {
  string make_filter = 1; 
}

message ModelsListResponse {
  repeated CarModel models = 1;
}

message CarModel {
  string model_id = 1;
  string make = 2;
  string model_name = 3;
  int32 year = 4;
  double base_price = 5;
  string brochure_url = 6;
}

message AvailabilityRequest {
  string vin = 1;
}

message InventoryUnit {
  string vin = 1;
  string model_id = 2;
  string color = 3;
  double actual_price = 4;
  string status = 5;
  string image_url = 6;
}

message UpdateUnitRequest {
  string vin = 1;
  string new_status = 2; 
}

message UpdateUnitResponse {
  bool success = 1;
  string error_message = 2;
}