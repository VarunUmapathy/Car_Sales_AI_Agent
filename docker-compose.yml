version: '3.8'

services:
  postgres:
    image: postgis/postgis:15-3.3
    container_name: crm_postgres
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: 123
      POSTGRES_DB: dealership_crm
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - crm_network
    restart: unless-stopped

  pg_bouncer:
    image: bitnamilegacy/pgbouncer:1.24.0
    container_name: crm_pgbouncer
    environment: 
      POSTGRESQL_HOST: postgres
      POSTGRESQL_PORT: 5432
      POSTGRESQL_USER: admin
      POSTGRESQL_PASSWORD: 123
      POSTGRESQL_DATABASE: dealership_crm

      PGBOUNCER_DATABASE: dealership_crm
      PGBOUNCER_POOL_MODE: transaction # maybe statement pooling?
      PGBOUNCER_MAX_CLIENT_CONN: 1000
      PGBOUNCER_DEFAULT_POOL_SIZE: 20
    ports:
     - "6432:6432"
    depends_on:
      - postgres
    networks:
      - crm_network
    restart: unless-stopped

volumes:
  pg_data:

networks:
  crm_network: 
    driver: bridge